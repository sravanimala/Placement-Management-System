<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CampusHire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">CH</span> CampusHire</a>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="companies.html">Drives</a>
      <a href="student-dashboard.html">Student Dashboard</a>
      <a href="admin-dashboard.html">Admin Dashboard</a>
    </nav>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<main class="login-main">
  <div class="login-card card">
    <div class="section-title" style="margin-bottom:6px;"><span class="dot"></span>Sign in</div>
    <p class="text-muted" style="font-size:13.5px; margin-bottom:26px;">This is a mock login for demo purposes — no password required. Pick a role to continue.</p>

    <div class="role-options">
      <button class="role-option" id="pickStudent">
        <div class="role-icon">🎓</div>
        <div>
          <div class="role-name">Student</div>
          <div class="role-desc">View drives, apply, and track your application status.</div>
        </div>
      </button>
      <button class="role-option" id="pickAdmin">
        <div class="role-icon">🛠️</div>
        <div>
          <div class="role-name">Admin</div>
          <div class="role-desc">Post drives, review applicants, and update statuses.</div>
        </div>
      </button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">CampusHire Placement Management System — demo project</div>
</footer>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  initHeaderInteractions();

  document.getElementById("pickStudent").addEventListener("click", () => {
    loginAsStudent();
    showToast("Logged in as Student");
    setTimeout(() => window.location.href = "student-dashboard.html", 400);
  });

  document.getElementById("pickAdmin").addEventListener("click", () => {
    loginAsAdmin();
    showToast("Logged in as Admin");
    setTimeout(() => window.location.href = "admin-dashboard.html", 400);
  });
</script>
</body>
</html>
