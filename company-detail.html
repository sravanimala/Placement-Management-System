<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Details — CampusHire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/companies.css">
<style>
  .detail-grid{ display:grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px){ .detail-grid{ grid-template-columns: 1fr; } }
  .detail-header{ display:flex; gap:16px; align-items:center; margin-bottom: 18px; }
  .detail-header .logo-chip{ width:56px; height:56px; font-size:20px; border-radius:12px; }
  .detail-name{ font-family: var(--font-heading); font-size: 24px; font-weight: 800; }
  .detail-role{ color: var(--muted); font-size: 14px; }
  .detail-block{ padding: 22px; margin-bottom: 18px; }
  .detail-block h3{ font-family: var(--font-heading); font-size: 15px; margin-bottom: 12px; }
  .jd-list{ display:flex; flex-direction:column; gap:8px; }
  .jd-list li{ font-size: 13.5px; color: var(--ink); padding-left: 18px; position: relative; }
  .jd-list li::before{ content:"—"; position:absolute; left:0; color: var(--amber-dark); }
  .rounds-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .round-chip{
    font-family: var(--font-mono); font-size: 12px; padding: 6px 12px; border-radius: 20px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .side-stat{ display:flex; justify-content:space-between; font-size:13.5px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .side-stat:last-child{ border-bottom:none; }
  .side-stat span:first-child{ color: var(--muted); }
  .countdown{
    font-family: var(--font-mono); text-align:center; font-size: 22px; font-weight:700;
    color: var(--navy); padding: 14px 0;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">CH</span> CampusHire</a>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="companies.html" class="active">Drives</a>
      <a href="student-dashboard.html">Student Dashboard</a>
      <a href="admin-dashboard.html">Admin Dashboard</a>
    </nav>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<main class="container mt-24" style="margin-bottom:50px;" id="detailRoot">
  <!-- filled by company-detail.js -->
</main>

<footer class="site-footer">
  <div class="container">CampusHire Placement Management System — demo project</div>
</footer>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/company-detail.js"></script>
</body>
</html>
